<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Feedback cours">
    <meta name="description" content="Feedback anonyme sur le cours">
    <title>Feedback du cours</title>
    <link rel="stylesheet" href="styles.css?v=20260818-audit">
    <script src="scripts.js?v=20260818-audit" defer></script>
</head>
<body class="home-page">
    <main class="container">
        <button class="settings-icon icon-button" id="openAdminButton" type="button" aria-label="Ouvrir l’administration" title="Administration">⚙️</button>

        <h1>📚 Feedback du cours</h1>

        <div class="session-display" id="sessionDisplay">
            <span class="session-label">Session :</span>
            <span class="session-name" id="sessionName" aria-live="polite">Chargement…</span>
        </div>

        <section class="question-block" aria-labelledby="likedQuestion">
            <h2 class="question" id="likedQuestion">J’ai aimé le cours aujourd’hui</h2>
            <div class="smiley-container">
                <button class="smiley" type="button" data-feedback-type="liked" data-value="0" aria-label="Je n’ai pas aimé">😟</button>
                <button class="smiley" type="button" data-feedback-type="liked" data-value="1" aria-label="J’ai moyennement aimé">😐</button>
                <button class="smiley" type="button" data-feedback-type="liked" data-value="2" aria-label="J’ai aimé">🙂</button>
                <button class="smiley" type="button" data-feedback-type="liked" data-value="3" aria-label="J’ai beaucoup aimé">😃</button>
            </div>
        </section>

        <section class="question-block" aria-labelledby="learnedQuestion">
            <h2 class="question" id="learnedQuestion">J’ai appris quelque chose aujourd’hui</h2>
            <div class="smiley-container">
                <button class="smiley" type="button" data-feedback-type="learned" data-value="0" aria-label="Je n’ai rien appris">😟</button>
                <button class="smiley" type="button" data-feedback-type="learned" data-value="1" aria-label="J’ai appris un peu">😐</button>
                <button class="smiley" type="button" data-feedback-type="learned" data-value="2" aria-label="J’ai appris et compris">🙂</button>
                <button class="smiley" type="button" data-feedback-type="learned" data-value="3" aria-label="J’ai tout compris">😃</button>
            </div>
        </section>

        <p class="privacy-note">Tes réponses sont totalement anonymes 🔒</p>
    </main>

    <div class="popup" id="popup" role="status" aria-live="polite">✓ Réponse enregistrée !</div>

    <div class="modal-overlay" id="adminModal" aria-hidden="true">
        <section class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="adminModalTitle">
            <h2 id="adminModalTitle">🔐 Administration</h2>
            <form id="adminForm">
                <label class="sr-only" for="adminCode">Code administrateur</label>
                <input type="password" id="adminCode" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="current-password" placeholder="Code administrateur" required>
                <div class="modal-actions">
                    <button class="btn btn-primary" type="submit">Valider</button>
                    <button class="btn btn-secondary" id="cancelAdminButton" type="button">Annuler</button>
                </div>
            </form>
        </section>
    </div>

    <footer class="app-footer" aria-label="Informations sur l’application">
        <img class="app-footer__avatar" src="IMG/logo_dev.png" alt="" width="65" height="65">
        <p>
            Développé par <strong>Jérémy VIOLETTE</strong>
            <span aria-hidden="true">•</span>
            <a href="https://github.com/Einstein1987/feedback-cours/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">Licence MIT</a>
            <span aria-hidden="true">•</span>
            <a href="https://github.com/Einstein1987/feedback-cours" target="_blank" rel="noopener noreferrer">Code source</a>
        </p>
    </footer>
</body>
</html>
