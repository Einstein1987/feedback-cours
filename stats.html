<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques - Administration</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="stats-page">
    <div class="container">
        <div class="header">
            <span class="close-button" onclick="window.location.href='index.html'" title="Retour">✖</span>
            <h1>📊 Statistiques des Réponses</h1>
            <span class="settings-icon" onclick="openSettingsModal()" title="Paramètres">⚙️</span>
        </div>

        <div class="session-selector">
            <select id="sessionSelect" onchange="loadStats()">
                <option value="all">Toutes les sessions</option>
            </select>
        </div>

        <div class="info-box">
            <p id="resetDate">Chargement...</p>
            <p id="totalResponses" style="margin-top: 10px; font-size: 1.2rem;"></p>
        </div>

        <div class="stats-summary">
            <div class="stat-card">
                <h3>Moyenne "J'ai aimé"</h3>
                <div class="value" id="avgLiked">-</div>
            </div>
            <div class="stat-card">
                <h3>Moyenne "J'ai appris"</h3>
                <div class="value" id="avgLearned">-</div>
            </div>
            <div class="stat-card">
                <h3>Taux de satisfaction</h3>
                <div class="value" id="satisfaction">-</div>
            </div>
            <div class="stat-card">
                <h3>Total réponses</h3>
                <div class="value" id="totalCount">0</div>
            </div>
        </div>

        <div class="controls" id="controlButtons">
            <!-- Les boutons seront ajoutés dynamiquement selon la session sélectionnée -->
        </div>

        <div class="chart-container">
            <div class="chart-title">Distribution des réponses</div>
            <canvas id="statsChart"></canvas>
        </div>

        <div class="chart-container">
            <div class="chart-title">Évolution dans le temps</div>
            <canvas id="timeChart"></canvas>
        </div>

        <div class="session-management">
            <h3>🗂️ Gestion des sessions</h3>
            <div id="sessionList" class="session-list"></div>
        </div>
    </div>

    <!-- Modal Paramètres -->
    <div class="modal-overlay" id="settingsModal" onclick="closeModalById('settingsModal', event)">
        <div class="admin-modal" onclick="event.stopPropagation()">
            <h2>🔐 Changer le code admin</h2>
            <input type="password" id="newAdminCode" maxlength="4" placeholder="Nouveau code (4 chiffres)">
            <input type="password" id="confirmAdminCode" maxlength="4" placeholder="Confirmer le code">
            <div>
                <button class="btn btn-primary" onclick="changeAdminCode()">Modifier</button>
                <button class="btn btn-secondary" onclick="closeModalById('settingsModal')">Annuler</button>
            </div>
        </div>
    </div>

    <!-- Modal Nouvelle Session -->
    <div class="modal-overlay" id="sessionModal" onclick="closeModalById('sessionModal', event)">
        <div class="admin-modal" onclick="event.stopPropagation()">
            <h2>➕ Nouvelle Session</h2>
            <input type="text" id="newSessionName" placeholder="Nom de la session (ex: Cours 2025/2026)">
            <div>
                <button class="btn btn-success" onclick="createSession()">Créer</button>
                <button class="btn btn-secondary" onclick="closeModalById('sessionModal')">Annuler</button>
            </div>
        </div>
    </div>

    <!-- Modal Confirmation Reset -->
    <div class="modal-overlay" id="resetModal" onclick="closeModalById('resetModal', event)">
        <div class="admin-modal" onclick="event.stopPropagation()">
            <h2>⚠️ Confirmation</h2>
            <p id="resetConfirmText" style="margin-bottom: 20px;"></p>
            <div>
                <button class="btn btn-danger" onclick="confirmResetStats()">Confirmer</button>
                <button class="btn btn-secondary" onclick="closeModalById('resetModal')">Annuler</button>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
